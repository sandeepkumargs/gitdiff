name: TypeScript CI with ESLint & Prettier

on:
  push:
    branches: [fearture]  # change as needed

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: set
        run: |
          SERVICES=("org" "mm" "ac" "onboard" "table" "ts")
          CHANGED=()
          for svc in "${SERVICES[@]}"; do
            if git diff --name-only HEAD^ HEAD | grep -q "^services/${svc}/"; then
              CHANGED+=("\"$svc\"")
            fi
          done
          MATRIX=$(printf '[%s]' "$(IFS=,; echo "${CHANGED[*]}")")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          npm i

      - name: Install global ESLint + Prettier
        run: |
          npm install -g eslint @typescript-eslint/parser @typescript-eslint/eslint-plugin prettier eslint-config-prettier eslint-plugin-prettier

      - name: Run ESLint
        working-directory: services/${{ matrix.service }}
        run: |
          if [ -f .eslintrc.js ] || [ -f .eslintrc.json ]; then
            eslint "src/**/*.{ts,tsx}" --max-warnings=0
          else
            echo "No ESLint config found for ${{ matrix.service }}"
          fi

      - name: Run Prettier check
        working-directory: services/${{ matrix.service }}
        run: |
          if [ -f .prettierrc ] || [ -f .prettierrc.json ]; then
            prettier --check "src/**/*.{ts,tsx,js,jsx,json,md}"
          else
            echo "No Prettier config found for ${{ matrix.service }}"
          fi

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: |
          if npm run | grep -q "test"; then
            npm test
          else
            echo "No test script found for ${{ matrix.service }}"
          fi

      - name: Type-check (tsc)
        working-directory: services/${{ matrix.service }}
        run: |
          if [ -f tsconfig.json ]; then
            npx tsc --noEmit
          else
            echo "No tsconfig.json found for ${{ matrix.service }}"
          fi
