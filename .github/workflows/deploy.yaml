name: Multi-Service Docker Deployment

on:
  push:
    branches: [fearture]   # fix typo: was 'fearture'

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  DOCKERHUB_REPOSITORY: ${{ secrets.DOCKERHUB_REPOSITORY }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      org_changed: ${{ steps.set.outputs.org }}
      mm_changed: ${{ steps.set.outputs.mm }}
      ac_changed: ${{ steps.set.outputs.ac }}
      onboard_changed: ${{ steps.set.outputs.onboard }}
      table_changed: ${{ steps.set.outputs.table }}
      ts_changed: ${{ steps.set.outputs.ts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: set
        run: |
          ORG=$(git diff --name-only HEAD^ HEAD | grep -q '^services/org/' && echo true || echo false)
          MM=$(git diff --name-only HEAD^ HEAD | grep -q '^services/mm/' && echo true || echo false)
          AC=$(git diff --name-only HEAD^ HEAD | grep -q '^services/ac/' && echo true || echo false)
          ONBOARD=$(git diff --name-only HEAD^ HEAD | grep -q '^services/onboard/' && echo true || echo false)
          TABLE=$(git diff --name-only HEAD^ HEAD | grep -q '^services/table/' && echo true || echo false)
          TS=$(git diff --name-only HEAD^ HEAD | grep -q '^services/ts/' && echo true || echo false)

          echo "auth=$AUTH" >> $GITHUB_OUTPUT
          echo "org=$ORG" >> $GITHUB_OUTPUT
          echo "mm=$MM" >> $GITHUB_OUTPUT
          echo "ac=$AC" >> $GITHUB_OUTPUT
          echo "onboard=$ONBOARD" >> $GITHUB_OUTPUT
          echo "table=$TABLE" >> $GITHUB_OUTPUT
          echo "ts=$TS" >> $GITHUB_OUTPUT

  build-and-push-org:
    needs: detect-changes
    if: needs.detect-changes.outputs.org_changed == 'true'
    uses: ./.github/workflows/build-push-template.yaml
    with:
      service: org

  build-and-push-mm:
    needs: detect-changes
    if: needs.detect-changes.outputs.mm_changed == 'true'
    uses: ./.github/workflows/build-push-template.yaml
    with:
      service: mm

  build-and-push-ac:
    needs: detect-changes
    if: needs.detect-changes.outputs.ac_changed == 'true'
    uses: ./.github/workflows/build-push-template.yaml
    with:
      service: ac

  build-and-push-onboard:
    needs: detect-changes
    if: needs.detect-changes.outputs.onboard_changed == 'true'
    uses: ./.github/workflows/build-push-template.yaml
    with:
      service: onboard

  build-and-push-table:
    needs: detect-changes
    if: needs.detect-changes.outputs.table_changed == 'true'
    uses: ./.github/workflows/build-push-template.yaml
    with:
      service: table

  build-and-push-ts:
    needs: detect-changes
    if: needs.detect-changes.outputs.ts_changed == 'true'
    uses: ./.github/workflows/build-push-template.yaml
    with:
      service: ts

